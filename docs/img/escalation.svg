<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-label="The old code had a single unbounded eviction action and never reached a full cache clear. The new code escalates through three increasingly strong actions, ending in a full clear plus managed eviction, stronger than the old single action.">
  <defs><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#3d9fbd"/></marker></defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="14" font-size="11" fill="#a9793a" letter-spacing="1">ELUVIAN</text>
    <text x="0" y="122" font-size="11" fill="#3d9fbd" letter-spacing="1">LYRIUM — escalation ladder</text>
    <text x="0" y="216" font-size="10.5" fill="#7d8590">asserted by test: for every input with a failed create, the plan is never "do nothing" — 192 combinations</text>
    <text x="0" y="232" font-size="10.5" fill="#7d8590">asserted by test: each retry is strictly stronger than the one before it</text>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="0" y="28" width="250" height="40" rx="3" fill="none" stroke="#a9793a" stroke-width="1.5"/>
    <text x="125" y="46" font-size="11.5" fill="#a9793a" text-anchor="middle">evict everything + managed</text>
    <text x="125" y="61" font-size="10" fill="#7d8590" text-anchor="middle">the only action, every time</text>
    <text x="272" y="52" font-size="11" fill="#7d8590">and if that was not enough —</text>
    <rect x="470" y="28" width="180" height="40" rx="3" fill="none" stroke="#c1554d" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="560" y="46" font-size="11.5" fill="#c1554d" text-anchor="middle">clear_cache()</text>
    <text x="560" y="61" font-size="10" fill="#c1554d" text-anchor="middle">existed, never called</text>

    <line x1="0" y1="96" x2="860" y2="96" stroke="#7d8590" stroke-width="1" opacity="0.35"/>

    <rect x="0" y="138" width="176" height="44" rx="3" fill="none" stroke="#3d9fbd" stroke-width="1.2"/>
    <text x="88" y="157" font-size="11" fill="#3d9fbd" text-anchor="middle">evict 32</text>
    <text x="88" y="172" font-size="10" fill="#7d8590" text-anchor="middle">create failed once</text>
    <line x1="176" y1="160" x2="212" y2="160" stroke="#3d9fbd" stroke-width="1.3" marker-end="url(#e)"/>
    <rect x="216" y="138" width="196" height="44" rx="3" fill="none" stroke="#3d9fbd" stroke-width="1.5"/>
    <text x="314" y="157" font-size="11" fill="#3d9fbd" text-anchor="middle">evict 128 + managed</text>
    <text x="314" y="172" font-size="10" fill="#7d8590" text-anchor="middle">failed again</text>
    <line x1="412" y1="160" x2="448" y2="160" stroke="#3d9fbd" stroke-width="1.3" marker-end="url(#e)"/>
    <rect x="452" y="138" width="212" height="44" rx="3" fill="none" stroke="#3d9fbd" stroke-width="2.2"/>
    <text x="558" y="157" font-size="11" fill="#3d9fbd" text-anchor="middle">clear_cache + managed</text>
    <text x="558" y="172" font-size="10" fill="#7d8590" text-anchor="middle">still failing</text>
    <line x1="664" y1="160" x2="700" y2="160" stroke="#7d8590" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="706" y="156" font-size="10.5" fill="#3d9fbd">stronger than</text>
    <text x="706" y="170" font-size="10.5" fill="#3d9fbd">eluvian ever went</text>
  </g>
</svg>

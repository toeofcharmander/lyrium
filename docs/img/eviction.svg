<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Two charts of texture cache occupancy over time. The old behaviour drops the cache to zero on every rescue, repeatedly. The new behaviour trims a bounded batch and keeps most of the cache resident.">
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="14" font-size="11" fill="#a9793a" letter-spacing="1">ELUVIAN — emergency_evict(INT_MAX)</text>
    <text x="0" y="170" font-size="11" fill="#3d9fbd" letter-spacing="1">LYRIUM — bounded batch, rate limited, hysteresis</text>
  </g>
  <g font-family="system-ui, sans-serif">
    <line x1="40" y1="30" x2="40" y2="104" stroke="#7d8590" stroke-width="1"/>
    <line x1="40" y1="104" x2="820" y2="104" stroke="#7d8590" stroke-width="1"/>
    <text x="32" y="36" font-size="9.5" fill="#7d8590" text-anchor="end">full</text>
    <text x="32" y="107" font-size="9.5" fill="#7d8590" text-anchor="end">0</text>
    <polyline points="40,104 120,36 121,104 200,36 201,104 280,36 281,104 360,36 361,104 440,36 441,104 520,36 521,104 600,36 601,104 680,36 681,104 760,36 761,104 820,60" fill="none" stroke="#a9793a" stroke-width="1.6"/>
    <text x="300" y="126" font-size="10.5" fill="#c1554d">every rescue empties it completely, then it refills from disk</text>

    <line x1="0" y1="146" x2="860" y2="146" stroke="#7d8590" stroke-width="1" opacity="0.35"/>

    <line x1="40" y1="186" x2="40" y2="228" stroke="#7d8590" stroke-width="1"/>
    <line x1="40" y1="228" x2="820" y2="228" stroke="#7d8590" stroke-width="1"/>
    <text x="32" y="192" font-size="9.5" fill="#7d8590" text-anchor="end">full</text>
    <text x="32" y="231" font-size="9.5" fill="#7d8590" text-anchor="end">0</text>
    <polyline points="40,228 120,192 160,203 240,194 280,204 360,193 400,203 480,192 520,202 600,192 640,202 720,193 760,202 820,196" fill="none" stroke="#3d9fbd" stroke-width="1.8"/>
    <text x="300" y="248" font-size="10.5" fill="#3d9fbd">trims 32 entries at a time, at most once per 50 ms</text>
  </g>
</svg>

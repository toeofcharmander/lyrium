<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Before, each hook is verified and patched one at a time with the result discarded while the pool patch has already committed. After, all targets are verified first and nothing is written unless every one matches.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#7d8590"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#a9793a"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#c1554d"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,1 9,5 0,9" fill="#3d9fbd"/></marker>
  </defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="14" font-size="11" fill="#a9793a" letter-spacing="1">ELUVIAN</text>
    <text x="0" y="152" font-size="11" fill="#3d9fbd" letter-spacing="1">LYRIUM</text>
    <text x="0" y="98" font-size="11" fill="#c1554d">result: pool shrunk, hook #1 live, hook #2 absent — worse than not loading at all</text>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="0" y="28" width="120" height="34" rx="3" fill="none" stroke="#a9793a" stroke-width="1.4"/>
    <text x="60" y="49" font-size="11.5" fill="#a9793a" text-anchor="middle">pool patch</text>
    <line x1="120" y1="45" x2="176" y2="45" stroke="#a9793a" stroke-width="1.4" marker-end="url(#ap)"/>
    <text x="148" y="37" font-size="10" fill="#7d8590" text-anchor="middle">commits</text>
    <rect x="180" y="28" width="96" height="34" rx="3" fill="none" stroke="#7d8590" stroke-width="1.2"/>
    <text x="228" y="49" font-size="11.5" fill="#7d8590" text-anchor="middle">verify #1</text>
    <line x1="276" y1="45" x2="308" y2="45" stroke="#7d8590" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="312" y="28" width="90" height="34" rx="3" fill="none" stroke="#7d8590" stroke-width="1.2"/>
    <text x="357" y="49" font-size="11.5" fill="#7d8590" text-anchor="middle">patch #1</text>
    <line x1="402" y1="45" x2="434" y2="45" stroke="#7d8590" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="438" y="28" width="96" height="34" rx="3" fill="none" stroke="#7d8590" stroke-width="1.2"/>
    <text x="486" y="49" font-size="11.5" fill="#7d8590" text-anchor="middle">verify #2</text>
    <line x1="534" y1="45" x2="566" y2="45" stroke="#c1554d" stroke-width="1.4" marker-end="url(#af)"/>
    <rect x="570" y="28" width="118" height="34" rx="3" fill="none" stroke="#c1554d" stroke-width="1.6"/>
    <text x="629" y="49" font-size="11.5" fill="#c1554d" text-anchor="middle">mismatch</text>
    <line x1="688" y1="45" x2="716" y2="45" stroke="#c1554d" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#af)"/>
    <text x="790" y="42" font-size="11" fill="#c1554d" text-anchor="middle">result discarded</text>
    <text x="790" y="57" font-size="11" fill="#c1554d" text-anchor="middle">execution continues</text>

    <line x1="0" y1="120" x2="860" y2="120" stroke="#7d8590" stroke-width="1" opacity="0.35"/>

    <rect x="0" y="166" width="300" height="46" rx="3" fill="none" stroke="#7d8590" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="150" y="185" font-size="11.5" fill="#7d8590" text-anchor="middle">verify all 13 targets</text>
    <text x="150" y="201" font-size="10.5" fill="#7d8590" text-anchor="middle">read only — nothing written</text>
    <line x1="300" y1="189" x2="356" y2="189" stroke="#7d8590" stroke-width="1.2" marker-end="url(#a)"/>
    <polygon points="360,175 424,189 360,203" fill="none" stroke="#3d9fbd" stroke-width="1.5"/>
    <text x="392" y="224" font-size="10.5" fill="#3d9fbd" text-anchor="middle">gate</text>
    <line x1="424" y1="181" x2="486" y2="172" stroke="#3d9fbd" stroke-width="1.4" marker-end="url(#al)"/>
    <text x="450" y="162" font-size="10" fill="#7d8590" text-anchor="middle">all match</text>
    <rect x="490" y="152" width="180" height="34" rx="3" fill="none" stroke="#3d9fbd" stroke-width="1.5"/>
    <text x="580" y="173" font-size="11.5" fill="#3d9fbd" text-anchor="middle">patch all + pool patch</text>
    <line x1="424" y1="197" x2="486" y2="208" stroke="#c1554d" stroke-width="1.4" marker-end="url(#af)"/>
    <text x="450" y="222" font-size="10" fill="#7d8590" text-anchor="middle">any differ</text>
    <rect x="490" y="192" width="180" height="34" rx="3" fill="none" stroke="#c1554d" stroke-width="1.5"/>
    <text x="580" y="213" font-size="11.5" fill="#c1554d" text-anchor="middle">write nothing at all</text>
    <text x="682" y="213" font-size="10.5" fill="#7d8590">executable untouched</text>
  </g>
</svg>
